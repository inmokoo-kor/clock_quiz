<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시계 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .clock { width: 200px; height: 200px; border: 8px solid #333; border-radius: 50%; position: relative; margin: 0 auto; background: white; }
        .center-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: #333; border-radius: 50%; z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #333; border-radius: 4px; transition: transform 0.5s cubic-bezier(0.4, 2.0, 0.2, 1); }
        .hour-hand { width: 6px; height: 50px; margin-left: -3px; background: #2563eb; }
        .minute-hand { width: 4px; height: 80px; margin-left: -2px; background: #ef4444; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg text-center max-w-md w-full mx-4">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">지금은 몇 시일까요?</h1>
        <div class="clock mb-8">
            <div class="center-dot"></div>
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
        </div>
        <div id="options" class="grid grid-cols-2 gap-4 mb-6"></div>
        <div id="result" class="text-xl font-bold h-8 mb-4"></div>
        <button onclick="generateQuiz()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg w-full transition">다음 문제</button>
    </div>

    <script>
        // 무작위 응원 메시지 리스트 (20가지)
        const cheeringMessages = [
            "우와! 정답이야! 진짜 잘하는데? 🎉",
            "최고! 시계 박사님이네! 🎓",
            "대단해! 완벽하게 맞췄어! 🌟",
            "참 잘했어요! 다음 문제도 도전해볼까? 🚀",
            "짝짝짝! 정답! 너무 멋져! 👏",
            "와~ 천재 아냐?! 정답! ✨",
            "대박! 시계 보기 너무 쉽지? 😆",
            "훌륭해! 예인이 최고! 👧🏻💕",
            "정답! 이대로 쭉쭉 가보자고! 🌈",
            "딩동댕! 우리 예인이 진짜 똑똑하네! 🎊",
            "와, 초등학교 2학년 언니는 역시 다르네! 완벽해! 🏫✨",
            "교헌이도 옆에서 누나 최고라고 박수 짝짝짝! 👶🏻👏",
            "아빠가 엄청 자랑스러워할 거야! 예인이 정답! 👨‍👧💕",
            "예인아, 어항 속 구피들도 꼬리 치며 축하해 주고 있어! 🐟💦",
            "퍼펙트! 눈썰미가 엄청난걸? 👀✨",
            "앗, 눈부셔! 정답의 빛이 반짝반짝! 💫",
            "정답! 예인이 미소처럼 기분 좋은 결과야! 🥰",
            "눈 깜짝할 새 맞췄네! 최고! 💖",
            "딩동댕! 예인이의 시계 실력이 쑥쑥 크고 있어! 🌱",
            "와우! 정말 대단해! 백점 만점에 천점! 💯"
        ];

        let currentTimeText = "";

        function formatTimeText(h, m) {
            if (m === 0) return `${h}시 정각`;
            if (m > 30) {
                let nextHour = h === 12 ? 1 : h + 1;
                let minsTo = 60 - m;
                return `${nextHour}시 ${minsTo}분 전`;
            }
            return `${h}시 ${m}분`;
        }

        function generateQuiz() {
            document.getElementById('result').innerText = "";
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = "";

            let h = Math.floor(Math.random() * 12) + 1;
            let m = Math.floor(Math.random() * 12) * 5; 
            
            currentTimeText = formatTimeText(h, m);

            // 시계 바늘 각도 계산
            let hourAngle = (h % 12) * 30 + (m * 0.5);
            let minuteAngle = m * 6;
            document.getElementById('hourHand').style.transform = `rotate(${hourAngle}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteAngle}deg)`;

            let options = [currentTimeText];
            while(options.length < 4) {
                let wrongH = Math.floor(Math.random() * 12) + 1;
                let wrongM = Math.floor(Math.random() * 12) * 5;
                let wrongText = formatTimeText(wrongH, wrongM);
                if(!options.includes(wrongText)) options.push(wrongText);
            }

            // 보기 섞기
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 px-4 rounded-lg border-2 border-transparent focus:outline-none transition";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const resultDiv = document.getElementById('result');
            const buttons = document.querySelectorAll('#options button');
            
            if (selected === currentTimeText) {
                const randomMsg = cheeringMessages[Math.floor(Math.random() * cheeringMessages.length)];
                resultDiv.innerText = randomMsg;
                resultDiv.className = "text-xl font-bold h-8 mb-4 text-green-500 break-keep";
                btn.classList.add('border-green-500', 'bg-green-50');
                // 정답을 맞추면 다른 버튼 비활성화
                buttons.forEach(b => b.disabled = true);
            } else {
                resultDiv.innerText = "앗, 다시 한 번 잘 볼까? 🤔";
                resultDiv.className = "text-xl font-bold h-8 mb-4 text-red-500 break-keep";
                btn.classList.add('border-red-500', 'bg-red-50');
            }
        }

        generateQuiz();
    </script>
</body>
</html>
